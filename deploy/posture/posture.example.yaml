# /etc/aegis/posture.yaml — the bank's posture scans. Paths may be absolute or relative to this file.
store: /var/lib/aegis/posture           # set the console's AEGIS_POSTURE_DIR to this
interval_minutes: 1440                  # only used with --loop; the systemd timer is preferred
keep_runs: 365                          # one year of dated assessment records
waivers: /etc/aegis/waivers.yaml        # the exception register (reason, approver, expiry)
sla_days: {critical: 7, high: 30, medium: 90, low: 180}
# ACT NOW exposures get a remediation proposal through the approval queue (AEGIS_HITL_TRANSPORT in
# /etc/aegis/posture.env: dashboard | servicenow | file); the next run verifies the path closed.
remediation: {enabled: true, tiers: [ACT_NOW]}

scans:
  - name: aws-prod-iam
    type: iam
    auth_details: /var/lib/aegis/exports/aws-prod/auth.json
    credential_report: /var/lib/aegis/exports/aws-prod/credential-report.json
    trusted_accounts: ["222222222222"]   # approved vendor / org accounts
  - name: aws-prod-ap-south-1
    type: cspm
    bundle: /var/lib/aegis/exports/aws-prod/cspm-ap-south-1.json
  - name: aws-dr-ap-south-2
    type: cspm
    live: true                          # AEGIS_POSTURE_LIVE=1 + read-only role; omit for export mode
    region: ap-south-2
  - name: azure-prod-centralindia
    type: azure
    bundle: /var/lib/aegis/exports/azure-prod/azure.json   # python -m aegis.posture export-azure --out …
  - name: azure-dr-southindia
    type: azure
    live: true                          # AEGIS_POSTURE_LIVE=1 + az login as Reader + Security Reader
    subscription: bank-dr-southindia
  - name: eks-payments
    type: k8s
    export: /var/lib/aegis/exports/eks-payments.json
  - name: infra-repo-main
    type: iac
    plan: /var/lib/aegis/exports/infra-repo/plan.json
    k8s: [/var/lib/aegis/exports/infra-repo/k8s]
  - name: exposure-prod
    type: exposure
    vulns: [/var/lib/aegis/exports/tenable]              # Tenable / Qualys CSV / Trivy JSON
    aws_bundles: [/var/lib/aegis/exports/aws-prod-aps1.json]
    azure_bundles: [/var/lib/aegis/exports/azure-prod/azure.json]
    k8s_exports: [eks-payments=/var/lib/aegis/exports/eks-payments.json]
    kev: /var/lib/aegis/feeds/known_exploited_vulnerabilities.json
    epss: /var/lib/aegis/feeds/epss_scores.csv
    waf_coverage: [/var/lib/aegis/exports/waf-coverage.json]   # python -m aegis.exposure.coverage
