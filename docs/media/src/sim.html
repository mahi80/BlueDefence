<!doctype html>
<meta charset="utf-8">
<title>BlueDefence simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  html,body{margin:0;background:#000}
  canvas{display:block}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ------------------------------------------------------------ setup --
const W = 1920, H = 1080;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const C = { bg:"#0b1220", panel:"#111a2c", line:"#24324a", fg:"#e8edf5", mute:"#8b98ad", acc:"#3ddc97", warn:"#ffb454", bad:"#ff6b6b", blue:"#5aa9ff", swarm:"#b388ff", dim:"#1a2538" };
const SANS = "'IBM Plex Sans', system-ui, sans-serif", MONO = "'IBM Plex Mono', monospace";
window.SCENES = window.SCENES || [9,16,20,24,28,14,34,27,21,28,16,10];   // overridden by the driver
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eo = t=>1-Math.pow(1-clamp(t,0,1),3);
const seeded = (s)=>{let x=Math.sin(s*9301+49297)*233280;return x-Math.floor(x)};
function font(sz,w=400,m=false){ctx.font=`${w} ${sz}px ${m?MONO:SANS}`}
function txt(s,x,y,{sz=28,w=400,col=C.fg,m=false,al="left",a=1}={}){ctx.save();ctx.globalAlpha*=clamp(a,0,1);font(sz,w,m);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline="alphabetic";ctx.fillText(s,x,y);ctx.restore()}
function rr(x,y,w,h,r,fill,stroke,lw=1.5,a=1){ctx.save();ctx.globalAlpha*=clamp(a,0,1);ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}ctx.restore()}
function dot(x,y,r,col,glow=0,a=1){ctx.save();ctx.globalAlpha*=clamp(a,0,1);if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow}ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function line(x1,y1,x2,y2,col,lw=2,a=1,dash){ctx.save();ctx.globalAlpha*=clamp(a,0,1);ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function wrap(s,x,y,maxw,lh,o={}){font(o.sz||28,o.w||400,o.m);const words=s.split(" ");let ln="",yy=y;for(const w of words){const t=ln?ln+" "+w:w;if(ctx.measureText(t).width>maxw&&ln){txt(ln,x,yy,o);yy+=lh;ln=w}else ln=t}if(ln)txt(ln,x,yy,o);return yy+lh}
function typed(s,t,cps=40){return s.slice(0,Math.floor(t*cps))}

// particles (background)
const P = Array.from({length:70},(_,i)=>({x:seeded(i)*W,y:seeded(i+100)*H,vx:(seeded(i+200)-.5)*18,vy:(seeded(i+300)-.5)*18}));
function bg(t,glow=.1){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W*.85,H*.1,0,W*.85,H*.1,900);g.addColorStop(0,`rgba(90,169,255,${glow})`);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*.1,H,0,W*.1,H,700);g.addColorStop(0,`rgba(61,220,151,${glow*.8})`);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const pts=P.map(p=>({x:((p.x+p.vx*t)%W+W)%W,y:((p.y+p.vy*t)%H+H)%H}));
  for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<170)line(pts[i].x,pts[i].y,pts[j].x,pts[j].y,C.line,1,(1-d/170)*.6)}dot(pts[i].x,pts[i].y,1.6,C.mute,0,.5)}
}
function chrome(kicker,title,t,{logo=true,sub=""}={}){
  if(logo)txt("BlueDefence",W-120,96,{sz:28,w:600,col:C.mute,m:true,al:"right",a:ease(t/.5)});
  txt(kicker,120,118,{sz:26,w:500,col:C.acc,m:true,a:ease(t/.6)});
  wrap(title,120,205,1500,76,{sz:66,w:600,a:ease((t-.2)/.7)});
  if(sub)wrap(sub,120,H-120,1500,42,{sz:30,col:C.mute,a:ease((t-.8)/.7)});
}
function scene(t){let i=0,acc=0;for(;i<SCENES.length;i++){if(t<acc+SCENES[i])return[i,t-acc,SCENES[i]];acc+=SCENES[i]}return[SCENES.length-1,t-acc+SCENES[SCENES.length-1],SCENES[SCENES.length-1]]}

// ------------------------------------------------------------ topology --
// 2 cores, 4 dists, 12 access; DIST-03 single-homed → its 3 access switches strand when its uplink dies
const TOPO = (()=>{
  const n={}, e=[];
  const add=(id,role,x,y,users=0)=>n[id]={id,role,x,y,users};
  add("CORE-01","core",730,160);add("CORE-02","core",1130,160);e.push(["CORE-01","CORE-02"]);
  const dx=[430,730,1030,1330];
  for(let i=0;i<4;i++){const id=`DIST-0${i+1}`;add(id,"dist",dx[i],330);e.push([id,i===2?"CORE-01":"CORE-01"]);if(i!==2)e.push([id,"CORE-02"]);
    for(let j=0;j<3;j++){const a=`ACC-${String(i*3+j+1).padStart(2,"0")}`;add(a,"acc",dx[i]-100+j*100,520,120+((i*3+j)*37)%160);e.push([a,id])}}
  return {n,e};
})();
const STRANDED=["ACC-07","ACC-08","ACC-09"];
function drawTopo(ox,oy,sc,t,{cut=false,cutAt=0,stranded=false,alpha=1,labels=true}={}){
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);ctx.globalAlpha*=alpha;
  for(const [a,b] of TOPO.e){const A=TOPO.n[a],B=TOPO.n[b];const isCut=cut&&a==="DIST-03"&&b==="CORE-01";
    const col=isCut?C.bad:(stranded&&(STRANDED.includes(a)))?C.warn:C.line;line(A.x,A.y,B.x,B.y,col,isCut?4:2.2,1,isCut?[10,8]:null);
    if(isCut){const k=(t-cutAt)*2%1;dot(lerp(A.x,B.x,k),lerp(A.y,B.y,k),5,C.bad,16)}}
  for(const id in TOPO.n){const d=TOPO.n[id];const r=d.role==="core"?22:d.role==="dist"?17:12;
    let col=d.role==="core"?C.blue:d.role==="dist"?C.fg:C.mute;
    if(stranded&&STRANDED.includes(id))col=C.warn;if(cut&&id==="DIST-03")col=C.bad;
    dot(d.x,d.y,r+6,col,0,.12);dot(d.x,d.y,r,C.panel);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(d.x,d.y,r,0,Math.PI*2);ctx.stroke();ctx.restore();
    if(labels)txt(id,d.x,d.y+r+22,{sz:d.role==="acc"?15:18,col,m:true,al:"center"})}
  ctx.restore();
}

// ------------------------------------------------------------ swarm force sim (pre-baked) --
const SWARM=(()=>{
  const nodes=[{id:"Imperva WAF",k:"alert",v:"malicious"},{id:"AEGIS",k:"aegis"},
    ...["ioc_extract","intel_enrich","blast_radius","log_hunt","deception_check"].map(w=>({id:w,k:"worker"})),
    {id:"edge-waf",k:"service",v:"malicious"},{id:"api-gw-01",k:"service",v:"malicious"},{id:"app-ledger-07",k:"host",v:"suspicious",act:true},
    {id:"svc-acct-pay",k:"identity",v:"suspicious",act:true},{id:"db-core",k:"data",v:"uncertain",crit:true}];
  const ix=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  const links=[["Imperva WAF","AEGIS","swarm"],...nodes.filter(n=>n.k==="worker").map(n=>["AEGIS",n.id,"swarm"]),
    ["Imperva WAF","edge-waf","attack"],["edge-waf","api-gw-01","attack"],["api-gw-01","app-ledger-07","lateral"],["svc-acct-pay","app-ledger-07","lateral"],["app-ledger-07","db-core","choke"]]
    .map(([a,b,k])=>({a:ix[a],b:ix[b],k}));
  const cx=0,cy=0;nodes.forEach((n,i)=>{n.x=cx+Math.cos(i*2.1)*(40+i*22);n.y=cy+Math.sin(i*2.1)*(40+i*22);n.vx=0;n.vy=0});
  nodes[0].x=-345;nodes[0].y=0;
  const frames=[];
  for(let f=0;f<900;f++){
    const alpha=Math.max(.02,1-f/600);
    for(const l of links){const A=nodes[l.a],B=nodes[l.b];const want=l.k==="swarm"?120:210;const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1;const k=(d-want)/d*(l.k==="swarm"?.09:.05)*alpha;A.vx+=dx*k;A.vy+=dy*k;B.vx-=dx*k;B.vy-=dy*k}
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const A=nodes[i],B=nodes[j];let dx=B.x-A.x,dy=B.y-A.y;let d2=dx*dx+dy*dy;if(d2<1)d2=1;const f2=-1600*alpha/d2;const d=Math.sqrt(d2);A.vx+=dx/d*f2;A.vy+=dy/d*f2;B.vx-=dx/d*f2;B.vy-=dy/d*f2;
      const minD=95;if(d<minD){const push=(minD-d)/2;A.x-=dx/d*push;A.y-=dy/d*push;B.x+=dx/d*push;B.y+=dy/d*push}}
    for(const n of nodes){n.vx-=n.x*.012*alpha;n.vy-=n.y*.018*alpha;n.vx*=.78;n.vy*=.78;n.x+=n.vx;n.y+=n.vy}
    nodes[0].x=-345;nodes[0].y=0;
    frames.push(nodes.map(n=>[n.x,n.y]));
  }
  return {nodes,links,frames};
})();
const VC={malicious:C.bad,suspicious:C.warn,benign:C.acc,uncertain:C.mute};
const GL={alert:"!",host:"H",service:"S",identity:"ID",data:"DB"};
const FINDINGS=[["ioc_extract",6.0,"bearer token not signed by the org IdP (unknown kid) — forged","high"],["intel_enrich",11.5,"203.0.113.77 on 2 threat-intel feeds as a forged-token C2 · EPSS 0.91","high"],["blast_radius",17.5,"edge-waf → api-gw-01 → app-ledger-07 · one hop from db-core (ledger)","high"],["log_hunt",23.0,"svc-acct-pay authenticated from app-ledger-07 at 05:41Z — never from that host","medium"],["deception_check",28.5,"no honeytoken touched — exposure stage, ledger not confirmed reached","low"]];
function workerPulse(name,t){const f=FINDINGS.find(x=>x[0]===name);if(!f)return 0;const d=t-f[1];return d>0&&d<1.2?Math.sin(d/1.2*Math.PI):0}
function drawSwarm(ox,oy,t,a=1){
  const f=SWARM.frames[clamp(Math.floor(t*30),0,SWARM.frames.length-1)];
  ctx.save();ctx.translate(ox,oy);ctx.scale(1.25,1.25);ctx.globalAlpha*=a;
  const vis=i=>{const n=SWARM.nodes[i];if(n.k==="worker")return ease((t-1-(i-2)*.25)/.5);if(n.k==="aegis")return ease((t-.4)/.5);if(n.k==="alert")return 1;return ease((t-3-(i-7)*.5)/.6)};
  for(const l of SWARM.links){const [x1,y1]=f[l.a],[x2,y2]=f[l.b];const al=Math.min(vis(l.a),vis(l.b));const col=l.k==="swarm"?C.swarm:l.k==="choke"?C.acc:C.bad;
    line(x1,y1,x2,y2,col,l.k==="swarm"?1.5:2.5,al*.8,l.k==="choke"?[8,6]:null);
    if(l.k!=="swarm"&&al>.9){const k=(t*.6+l.a*.3)%1;dot(lerp(x1,x2,k),lerp(y1,y2,k),4,col,12,al)}}
  SWARM.nodes.forEach((n,i)=>{const [x,y]=f[i];const al=vis(i);if(al<=0)return;const r=n.k==="alert"?20:n.k==="aegis"?17:n.k==="worker"?10:n.crit?17:13;
    const col=n.k==="worker"||n.k==="aegis"?C.swarm:VC[n.v];
    if(n.crit){ctx.save();ctx.globalAlpha*=al;ctx.strokeStyle=C.acc;ctx.setLineDash([4,4]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.stroke();ctx.restore()}
    const pul=n.k==="worker"?workerPulse(n.id,t):0;
    if(pul>0){dot(x,y,r+10+pul*22,C.acc,0,.35*pul*al);line(x,y,f[1][0],f[1][1],C.acc,3,pul*al)}
    dot(x,y,r+8,col,0,.12*al);dot(x,y,r+(pul*3),pul>0?C.acc:col,n.k==="aegis"?18:pul*16,al);
    if(GL[n.k])txt(GL[n.k],x,y+5,{sz:13,w:600,col:"#0b1220",m:true,al:"center",a:al});
    if(n.act)dot(x+r-3,y-r+3,5,C.acc,8,al);
    txt(n.id,x,y+r+18,{sz:n.k==="worker"?14:16,col:n.k==="worker"?C.swarm:C.fg,m:true,al:"center",a:al})});
  ctx.restore();
}

// ------------------------------------------------------------ scenes --
const ALARMS=["%LINK-3-UPDOWN DIST-03 Ethernet1/49 changed state to down","%OSPF-5-ADJCHG ACC-07 Nbr 10.2.0.1 FULL to DOWN","%LINEPROTO-5-UPDOWN ACC-08 Gi1/0/49 down","%BGP-5-ADJCHANGE CORE-01 neighbor 10.0.3.2 Down","device_unreachable ACC-09 (180 s silent)","%LINK-3-UPDOWN ACC-07 Gi1/0/49 down","%ETHPORT-5-IF_DOWN_LINK_FAILURE DIST-03 Eth1/49","%OSPF-5-ADJCHG ACC-08 FULL to DOWN","SNMP linkDown trap DIST-03 ifIndex 49","%LINK-3-UPDOWN ACC-09 Gi1/0/49 down","telemetry: ACC-07 in_errors spike","%OSPF-5-ADJCHG ACC-09 FULL to DOWN","NetFlow: 0 flows from 10.2.7.0/24","device_unreachable ACC-07","%LINEPROTO-5-UPDOWN ACC-09 down","Sentinel: 412 failed logons ACC-07 segment","%BGP-5-ADJCHANGE CORE-01 Down","device_unreachable ACC-08","telemetry: DIST-03 Eth1/49 oper-down","%LINK-3-UPDOWN ACC-08 Gi1/0/49 down"];
function s1(t,T){bg(t,.14);
  txt("BLUEDEFENCE · AEGIS",120,330,{sz:28,w:500,col:C.acc,m:true,a:ease(t/.8)});
  wrap("An autonomous SOC that runs inside the bank — and shows its work.",120,440,1500,96,{sz:86,w:600,a:ease((t-.4)/.9)});
  wrap("Correlates every alarm into one root cause · triages with a model you host · keeps a human on every irreversible action · leaves an audit trail a regulator can verify.",120,720,1400,46,{sz:32,col:C.mute,a:ease((t-1.4)/.9)});
  txt("github.com/mahi80/BlueDefence",120,H-64,{sz:24,col:C.mute,m:true,a:ease((t-2)/.8)});
  rr(0,0,W,H,0,null,null,0);ctx.fillStyle=`rgba(11,18,32,${1-ease(t/.6)})`;ctx.fillRect(0,0,W,H);}
function s2(t,T){bg(t);chrome("THE PROBLEM","One fibre cut. Fifty-three alarms. An analyst with twenty minutes.",t);
  // left: streaming alarm log
  const n=Math.min(53,Math.floor(Math.max(0,t-1.5)*4.2));
  rr(120,330,900,620,16,"#070c16",C.line);txt("vendor consoles · live",150,368,{sz:20,col:C.mute,m:true});
  for(let i=Math.max(0,n-15);i<n;i++){const row=i-Math.max(0,n-15);const y=405+row*35;const s=ALARMS[i%ALARMS.length];const first=i===0;
    txt(`${String(i+1).padStart(2,"0")}  ${s}`,150,y,{sz:19,col:first?C.bad:(i%7===0?"#ffb3b3":C.mute),m:true,a:row===14?1:1})}
  // counter
  txt(String(n),1500,560,{sz:230,w:600,col:C.bad,al:"center",a:ease((t-1.5)/.6)});txt("alarms in 90 seconds",1500,620,{sz:28,col:C.mute,al:"center",a:ease((t-1.5)/.6)});
  const left=Math.max(0,20-Math.floor(Math.max(0,t-1.5)*1.2));txt(`analyst time left: ${left} min`,1500,700,{sz:26,col:left<8?C.warn:C.mute,m:true,al:"center",a:ease((t-3)/.6)});
  // mini topology
  drawTopo(1090,690,.42,t,{cut:t>2.2,cutAt:2.2,stranded:t>4,alpha:ease((t-.8)/.6),labels:false});
  txt("Every console is right. None of them says what happened.",120,H-72,{sz:30,col:C.mute,a:ease((t-9)/.8)});}
const FEEDS=[["WAF / CDN",C.blue],["Sentinel · Splunk",C.blue],["EDR",C.blue],["syslog · LLDP",C.acc],["NetFlow · gNMI",C.acc],["Zeek · Suricata",C.blue],["Kafka bridge",C.warn],["Cloud trails",C.blue]];
function s3(t,T){bg(t);chrome("STEP 1 · EVERYTHING COMES IN","One receiver, every feed you already have.",t,{sub:"Push or poll. No agents on endpoints, no SIEM replacement — it sits on top of what is already there."});
  const cx=960,cy=640;const R=330;
  rr(cx-170,cy-70,340,140,18,C.panel,C.acc,2,ease((t-.5)/.6));txt("/ingest/*",cx,cy-8,{sz:30,w:600,m:true,al:"center",a:ease((t-.5)/.6)});txt("Bearer AEGIS_INGEST_TOKEN",cx,cy+32,{sz:18,col:C.mute,m:true,al:"center",a:ease((t-.5)/.6)});
  const ev=Math.floor(Math.max(0,t-2)*137);txt(`${ev.toLocaleString()} events`,cx,cy+118,{sz:24,col:C.acc,m:true,al:"center",a:ease((t-2)/.5)});
  FEEDS.forEach(([name,col],i)=>{const a=-Math.PI/2+i*(Math.PI*2/8);const x=cx+Math.cos(a)*R*1.75,y=cy+Math.sin(a)*R*.8;const al=ease((t-.8-i*.18)/.5);
    rr(x-120,y-28,240,56,12,C.panel,col,1.5,al);txt(name,x,y+9,{sz:22,col,al:"center",a:al});
    if(t>1.6+i*.18){for(let p=0;p<3;p++){const k=((t*.55)+p/3+i*.11)%1;const px=lerp(x,cx,k),py=lerp(y,cy,k);dot(px,py,4,col,10,al*(1-k*.3))}}});}
function s4(t,T){bg(t);chrome("STEP 2 · CORRELATE","Topology-aware correlation turns the storm into one incident.",t);
  drawTopo(-150,230,.78,t,{cut:t>2,cutAt:2,stranded:t>3.5,alpha:ease(t/.6)});
  // alarm dots spawn at stranded nodes + dist-03 and fly into the incident card
  const card={x:1180,y:330,w:620,h:300};
  const nAl=Math.min(53,Math.floor(Math.max(0,t-2.5)*5));
  for(let i=0;i<nAl;i++){const src=TOPO.n[["DIST-03",...STRANDED,"CORE-01"][i%5]];const born=2.5+i/5;const k=ease((t-born)/1.1);if(k>=1)continue;
    const sx=-150+src.x*.78+(seeded(i)-.5)*40,sy=230+src.y*.78+30+(seeded(i+9)-.5)*40;dot(lerp(sx,card.x+card.w/2,k),lerp(sy,card.y+card.h/2,k)-Math.sin(k*Math.PI)*120,5,C.bad,12,1-k*.4)}
  const folded=Math.max(0,Math.min(52,Math.floor((t-3.6)*5)));
  rr(card.x,card.y,card.w,card.h,18,C.panel,C.acc,2,ease((t-2.4)/.6));
  txt("link_down",card.x+30,card.y+52,{sz:30,w:600,col:C.acc,m:true,a:ease((t-2.6)/.4)});txt("critical",card.x+200,card.y+52,{sz:26,w:600,col:C.bad,a:ease((t-2.8)/.4)});
  txt("DIST-03 Ethernet1/49 · link to CORE-01",card.x+30,card.y+96,{sz:22,col:C.fg,m:true,a:ease((t-3)/.4)});
  txt(`${t>3.6?3:0} switches · ${t>4?"1,240":"0"} users stranded · no redundant path`,card.x+30,card.y+140,{sz:22,col:C.warn,a:ease((t-3.4)/.4)});
  txt(`${folded} / 52 alarms folded in as symptoms`,card.x+30,card.y+184,{sz:22,col:C.mute,m:true,a:ease((t-3.6)/.4)});
  txt("no change ticket in the last 10 min · bad push? no",card.x+30,card.y+228,{sz:20,col:C.mute,a:ease((t-6)/.5)});
  txt("1 incident",card.x+30,card.y+272,{sz:24,w:600,col:C.acc,a:ease((t-14)/.5)});
  const big=ease((t-14)/.8);txt("53",1300,870,{sz:150,w:600,col:C.bad,al:"center",a:big});txt("→",1490,850,{sz:90,col:C.mute,al:"center",a:big});txt("1",1680,870,{sz:150,w:600,col:C.acc,al:"center",a:big});
  wrap("What it knows: LLDP topology · who sits behind which uplink · redundant paths · users per switch · recent config pushes and their tickets.",120,H-120,1000,38,{sz:26,col:C.mute,a:ease((t-8)/.8)});}
function s5(t,T){bg(t);chrome("STEP 3 · TRIAGE","The swarm investigates. A model the bank hosts decides.",t);
  rr(120,300,860,700,18,"#070c16",C.line,1.5,ease((t-.3)/.5));txt("live swarm · AEGIS orchestrator fans out five workers",150,340,{sz:20,col:C.swarm,m:true,a:ease((t-.3)/.5)});
  ctx.save();ctx.beginPath();ctx.rect(120,300,860,700);ctx.clip();drawSwarm(620,670,t-.6,ease((t-.6)/.5));ctx.restore();
