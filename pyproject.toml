[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluedefence"
version = "0.1.0"
description = "BlueDefence — AEGIS autonomous-SOC brain (Agent Q), governed by ACP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # imported directly by connectors, dashboards and dataset sources
    "httpx>=0.27",
]

[project.optional-dependencies]
# Derived index of the audit chain (aegis/store): one ORM, pick the database by AEGIS_INDEX_URL.
index = ["sqlalchemy>=2.0,<2.1", "duckdb-engine>=0.17", "duckdb>=1.1"]
postgres = ["sqlalchemy>=2.0,<2.1", "psycopg2-binary>=2.9"]
mssql = ["sqlalchemy>=2.0,<2.1", "pyodbc>=5.0"]
# On-prem Active Directory account disable (AEGIS_IDP_VENDOR=ad)
ad = ["ldap3>=2.9"]
# Kafka ingest (AEGIS_SOURCES=kafka; aegis/ingest/kafka.py)
kafka = ["confluent-kafka>=2.3"]
# Posture scans in live mode (AEGIS_POSTURE_LIVE=1). Offline exports need nothing extra.
posture-aws = ["boto3>=1.34"]
# Governance runtime — the ACP SDK that governs SOC-AGENTQ-01. Optional: AEGIS runs
# without it (the acp import degrades to a no-op). Pinned to mahi80/rbi @ b2e9d97.
# Private; see requirements-governance.txt for how to authenticate the install.
governance = [
    "acp-sdk @ git+https://github.com/mahi80/rbi.git@b2e9d97#subdirectory=acp-sdk",
]
# Test, fine-tune and RL extras live in aegis/requirements-*.txt.

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["aegis/tests"]
addopts = "-q"

[tool.setuptools.package-data]
# Runtime assets. Without these a wheel/sdist install imports but cannot build an orchestrator
# (system_prompt.md) or verify a licence (keys/*.pub.json); install.sh hid this by using -e.
"aegis" = [
    "_manifest.json",
    "keys/*.pub.json",
    "requirements*.txt",
    "prompts/*.md",
    "agents/*/system_prompt.md",
    "agents/*/prompts/*.md",
    "agents/edr/host_baselines.json",
    "agents/edr/collectors/*",
    "dataset/seed/*.json",
    "eval/*/cases.json",
    "ingest/connectors/*.yaml",
    "ingest/connectors/*.json",
    "ingest/fixtures/*.json",
    "ingest/fixtures/*/*.json",
    "healing/k8s/templates/*",
    "healing/k8s/*.yaml",
    "observability/k8s/templates/*",
    "observability/k8s/*.yaml",
    "k8s/templates/*",
    "k8s/*.yaml",
]
"aegis.agents.threat_intel" = ["sync.proto"]
"aegis.ingest" = ["connectors/*.yaml", "connectors/*.json"]
