AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BlueDefence licence service — issue / activate / verify, all inside the AWS free tier (Lambda + HTTP API + DynamoDB on-demand + SSM).

Parameters:
  Stage:
    Type: String
    Default: prod
  SigningKeyParam:
    Type: String
    Default: /bluedefence/license/signing-key
    Description: SSM SecureString holding the *.key.json from `python -m aegis.license keygen`
  AdminKeyParam:
    Type: String
    Default: /bluedefence/license/admin-key
    Description: SSM SecureString holding the admin API key (x-admin-key header)
  PubkeysParam:
    Type: String
    Default: /bluedefence/license/public-keys
    Description: optional SSM String with a JSON list of extra public keys (rotation)
  KnownFingerprintsParam:
    Type: String
    Default: /bluedefence/license/known-fingerprints
    Description: optional SSM String, JSON list of published release code fingerprints (python -m aegis.license fingerprint); heartbeats are attested against it
  AlertEmail:
    Type: String
    Default: ""
    Description: e-mail for fleet anomaly alerts (SNS subscription; confirm the e-mail AWS sends). Empty = no subscription

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]          # cheaper per ms; still inside the free tier either way
    Timeout: 10
    MemorySize: 256

Resources:
  LicenseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  LicenseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # Throttle hard: a licence API sees a handful of calls a day. This also keeps a stray loop
      # from ever leaving the free tier.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"t":"$context.requestTime","ip":"$context.identity.sourceIp","m":"$context.httpMethod","p":"$context.path","s":"$context.status","id":"$context.requestId"}'

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 90

  ContribBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: to-ia
            Status: Enabled
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 90 }]

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BlueDefence fleet alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LicenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: app.lambda_handler
      Environment:
        Variables:
          LICENSE_TABLE: !Ref LicenseTable
          SIGNING_KEY_PARAM: !Ref SigningKeyParam
          ADMIN_KEY_PARAM: !Ref AdminKeyParam
          PUBKEYS_PARAM: !Ref PubkeysParam
          KNOWN_FP_PARAM: !Ref KnownFingerprintsParam
          CONTRIB_BUCKET: !Ref ContribBucket
          ALERT_TOPIC_ARN: !Ref AlertTopic
      Policies:
        - S3WritePolicy: { BucketName: !Ref ContribBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - DynamoDBCrudPolicy: { TableName: !Ref LicenseTable }
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminKeyParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PubkeysParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KnownFingerprintsParam}
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref LicenseApi
            Path: /{proxy+}
            Method: ANY
        DailyFleetScan:
          Type: Schedule
          Properties:
            Schedule: cron(30 2 * * ? *)         # 08:00 IST
            Input: '{"fleet_scan": true}'

Outputs:
  ApiUrl:
    Description: Base URL — give this to `python -m aegis.license activate --server`
    Value: !Sub https://${LicenseApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TableName:
    Value: !Ref LicenseTable
  ContribBucket:
    Description: community contributions land here — aws s3 sync s3://<bucket>/contrib ./contrib && python -m aegis.dataset import-contrib ./contrib --out datasets/community-v1
    Value: !Ref ContribBucket
  AlertTopic:
    Value: !Ref AlertTopic
