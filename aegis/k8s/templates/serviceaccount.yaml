{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ include "aegis-agent.labels" . | indent 4 }}
  annotations:
    # IRSA: bind this ServiceAccount to the IAM role that has
    # bedrock:InvokeModel + secretsmanager:GetSecretValue + audit
    # bucket s3:PutObject permissions. The role ARN is from the
    # Terraform output of aegis/deploy/aws.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
