# AEGIS agent layer values

namespace: bank-prod

image:
  repository: registry.bank.internal/aegis
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Single replica, by design (review R-3): the service owns one audit hash chain, one
# alert checkpoint and one HITL queue, so a second pod would fork the chain and poll
# every source twice. The StatefulSet hard-codes replicas: 1 and the chart ships no HPA.
# Scale with `resources`, not pods.

# Push receiver — serves /healthz (probes), /metrics and /ingest/*. Needs
# AEGIS_INGEST_TOKEN in the aegis-runtime-credentials secret (bind is non-loopback).
receiver:
  port: 8787
  # NetworkPolicy peers allowed to push to /ingest/* (the OTel collector is always
  # allowed, for /metrics). Empty = only the collector. Example:
  #   ingressFrom:
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: logging}}
  ingressFrom: []

# Persistent state (PVC via volumeClaimTemplates): audit chain, checkpoint, HITL
# queue, ACP_HOME, caches. Everything else is read-only.
state:
  mountPath: /var/aegis
  size: 10Gi
  storageClassName: ""

# Installation identity (review round 8 R8-13). The licence is bound to AEGIS_INSTALL_ID; a pod's
# hostname / machine-id is not stable across reschedules, so it is pinned here. One of the two is
# required — the chart refuses to render without it. Get the id with
# `python -m aegis.license install-id` once and send it with the licence order.
installation:
  id: ""
  # or read it from a Secret: {name: aegis-installation, key: AEGIS_INSTALL_ID}
  idSecret:
    name: ""
    key: AEGIS_INSTALL_ID

# Licence. The service renews its token in place (7 days before expiry), so the token lives on the
# state PVC (<state.mountPath>/license/license.jwt). `existingSecret` (key `license.jwt`) seeds it:
# an init container copies it onto the PVC when the PVC has none or the Secret changed — never over
# a renewal. No secret = evaluation mode (shadow, external edition, evaluation limits).
license:
  enforce: "1"
  existingSecret: ""
  server: ""            # https://… licence service (heartbeat, renewal, model updates); empty = offline
  # NetworkPolicy has no FQDN rules: the CIDR(s) the licence server (or your egress proxy) resolves to.
  # Empty = no egress rule, and heartbeat/renewal cannot leave the pod.
  serverCIDRs: []
  serverPort: 443

# Audit retention key (review round 8 R8-3/R8-4). `python -m aegis.audit retire` signs its retention
# checkpoint with AEGIS_AUDIT_KEY and refuses without it; verify reports "unverifiable" without it.
# The pod will not start unless the Secret below has the key. Rotation: move the old value to
# AEGIS_AUDIT_KEY_PREVIOUS (same Secret), set a new one, run `python -m aegis.audit resign`.
audit:
  keySecret:
    name: aegis-runtime-credentials
    key: AEGIS_AUDIT_KEY

# IRSA — service account assumes an IAM role with bedrock:Invoke +
# secretsmanager:GetSecretValue + s3:PutObject on the audit bucket.
# Set `serviceAccount.roleArn` to the role ARN from the Terraform
# output `eks.cluster_name` deployment.
serviceAccount:
  create: true
  name: aegis-agent
  roleArn: ""   # populate per-tenant after `terraform apply`

# Resources tuned for agent layer's typical CPU (mostly I/O-bound) +
# memory (LLM client buffers + audit chain). Bump for higher throughput.
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# LLM backend selection — read by aegis.agents.shared.llm_client.get_client()
# AWS deployments typically use bedrock for in-VPC Claude access.
llm:
  backend: "bedrock"   # bedrock | anthropic | gemma | mock
  model: "anthropic.claude-sonnet-4-6"
  voter_backend: "gemma"   # multi-provider diversity for the voter
  voter_model: "google/gemma-2-9b-it"

# PII tokenization is mandatory in production. Don't disable.
pii_tokenization_enabled: "1"

# Token budget caps per session — bounds blast radius on a runaway
# agent + bounds Bedrock cost.
token_budget:
  max_input: "2000000"
  max_output: "200000"
  max_cost_cents: "5000"   # $50/session

# Egress allowlist — agent pods can only reach the listed services.
egress_allowlist:
  - service: bedrock-runtime
    cidr: ""    # populated from `aws_vpc_endpoint.bedrock_runtime` IPs
  - service: secretsmanager
    cidr: ""
  - service: splunk-rest
    cidr: ""    # bank's SIEM
  - service: servicenow-rest
    cidr: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Annotations to enable Prometheus scrape (paired with the OTel chart)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8787"   # /metrics is on the receiver; set AEGIS_METRICS_TOKEN + a bearer in the scrape job
  prometheus.io/path: "/metrics"
