# ServiceAccount + RBAC for the AEGIS Self-Healing controller.
# It can label pods (for quarantine), create Jobs (forensic snapshot) and
# patch Argo Rollouts (respawn); no delete on Deployments, no cluster-admin.
#
# Be clear about what "create jobs" means (review R-5): a Job creates pods, so
# by RBAC alone this Role could start ANY pod in the namespace — any image, any
# ServiceAccount, hostPath, hostPID, privileged. RBAC does not bound that; the
# ValidatingAdmissionPolicy in templates/forensic-admission-policy.yaml does:
# a Job created by this ServiceAccount must use the forensic image and the
# token-less forensic ServiceAccount running its pinned command, with no
# hostPath/secret/projected volumes or secret env, no node override (placement
# only via podAffinity to the target), no privileged container, no
# hostNetwork/hostIPC and no added capabilities beyond SYS_PTRACE/SYS_ADMIN. Do not deploy this Role without that policy (or an
# equivalent Kyverno/Gatekeeper rule) in place.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount }}
  namespace: {{ .Values.target.namespace }}
  labels:
{{ include "aegis.controllerLabels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.controller.serviceAccount }}
  namespace: {{ .Values.target.namespace }}
rules:
# Label pods: aegis.bank/quarantined=true (sever — the quarantine NetworkPolicy
# selects on it) and aegis.bank/forensic-target=<artifact> (the snapshot Job's
# podAffinity). `patch` is in use; forensic-admission-policy.yaml
# (aegis-healing-pod-patch) limits it to those two labels — no spec, image or
# annotation changes (review round 8 R8-9).
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch"]
# Read the forensic Job template it instantiates (and nothing else in ConfigMaps)
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["aegis-forensic-job-template"]
  verbs: ["get"]
# Create forensic snapshot Jobs (cannot delete other resources)
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create"]
# Trigger Rollout restart / abort / promote — but not delete
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list", "watch", "patch"]
# Read events for audit correlation
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.controller.serviceAccount }}
  namespace: {{ .Values.target.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.controller.serviceAccount }}
  namespace: {{ .Values.target.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.controller.serviceAccount }}
