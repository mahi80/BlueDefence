---
# Forensic snapshot pre-respawn. The AEGIS controller creates one of
# these as a Kubernetes Job before deleting the suspect pod, copying
# memory + disk + recent NetFlow into the WORM PVC for later analysis.
#
# This template is rendered by the controller dynamically with the
# specific pod name; the rendered manifest is recorded in the audit log.
# The template here is the canonical contract.
#
# Identity (review R-5): the Job runs as its OWN ServiceAccount
# ({{ .Values.forensics.serviceAccount }}) with no API token mounted — it needs no
# Kubernetes API access, and running it as the controller's SA handed a pod with
# hostPID + SYS_ADMIN the controller's credentials. There is no container-runtime
# socket mount: process state is read through hostPID + SYS_PTRACE, and the
# runtime socket would have been node-root for anyone who reached this container.
# templates/forensic-admission-policy.yaml rejects any Job the controller creates
# that deviates from this shape.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: aegis-forensic-
  namespace: {{ .Values.target.namespace }}
  labels:
{{ include "aegis.labels" . | indent 4 }}
    aegis.bank/role: forensic-snapshot
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
{{ include "aegis.labels" . | indent 8 }}
        aegis.bank/role: forensic-snapshot
    spec:
      serviceAccountName: {{ .Values.forensics.serviceAccount }}
      restartPolicy: Never
      automountServiceAccountToken: false
      hostPID: true     # required to read process state of suspect pod
      containers:
      - name: snapshot
        image: {{ .Values.forensics.image }}
        securityContext:
          privileged: false
          capabilities:
            add: [SYS_PTRACE, SYS_ADMIN]
            drop: [ALL]
        # The controller passes TARGET_POD + ARTIFACT_ID via env at
        # render time. The image runs LiME (memory) + criu (process
        # state) + tcpdump-on-replay against captured NetFlow.
        env:
        - name: TARGET_POD
          value: ""    # filled by controller
        - name: ARTIFACT_ID
          value: ""    # filled by controller (matches HealEvent.forensic_artifact_id)
        - name: AUDIT_LOG_BUCKET
          value: s3://bank-aegis-audit-worm/
        volumeMounts:
        - name: forensic-store
          mountPath: /forensic
      volumes:
      - name: forensic-store
        persistentVolumeClaim:
          claimName: aegis-forensic-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-forensic-pvc
  namespace: {{ .Values.target.namespace }}
  labels:
{{ include "aegis.labels" . | indent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.forensics.storageClass }}
  resources:
    requests:
      storage: {{ .Values.forensics.pvcSize }}
---
# The forensic Job's identity: no RBAC binding, no token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.forensics.serviceAccount }}
  namespace: {{ .Values.target.namespace }}
  labels:
{{ include "aegis.labels" . | indent 4 }}
automountServiceAccountToken: false
