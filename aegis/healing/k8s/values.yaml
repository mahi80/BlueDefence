# Self-Healing controller values. Override per environment.

# The protected workload — the application AEGIS will heal on compromise.
target:
  name: bank-api
  namespace: bank-prod
  image: registry.bank.internal/bank-api:1.4.2   # immutable, signed image
  replicas: 6
  containerPort: 8080

# Forensic snapshot destination (immutable WORM bucket / S3 Object Lock).
forensics:
  pvcSize: 50Gi        # per snapshot: each Job gets its own ephemeral claim
  storageClass: worm-immutable
  retentionDays: 2555  # ~7 years for regulatory retention
  # The snapshot Job's own identity (no API token) and image. The admission
  # policy only lets the controller create Jobs that use exactly these.
  serviceAccount: aegis-forensic-snapshot
  image: registry.bank.internal/aegis/forensic-tools:0.1.0
  # The snapshot tool's entrypoint, pinned by the admission policy: a Job the
  # controller creates must run exactly this command (and these args), so the
  # forensic image cannot be repurposed to run a shell with hostPID + SYS_ADMIN.
  command: ["/usr/local/bin/aegis-forensic-snapshot"]
  args: []
  # The WORM storage class MUST have reclaimPolicy: Retain — each snapshot gets its
  # own ephemeral claim, deleted with the Job's pod; Retain keeps the volume.

  # ValidatingAdmissionPolicy (Kubernetes >= 1.30) that constrains the Jobs the
  # controller may create. Leave on; turn off only on clusters < 1.30 and replace
  # it with an equivalent Kyverno/Gatekeeper rule.
  admissionPolicy: true

# Argo Rollouts canary parameters for the respawn step.
rollout:
  steps:
    - setWeight: 5
    - pause: { duration: 60 }
    - setWeight: 25
    - pause: { duration: 120 }
    - setWeight: 50
    - pause: { duration: 180 }
    - setWeight: 100
  canaryAnalysis:
    successThreshold: 0.99
    metricInterval: 30s

# Strict security context — respawn runs with these, ensuring clean state.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Egress policy: respawned pods reach only approved destinations.
egressAllowlist:
  - service: "bank-db.bank-prod.svc.cluster.local"
    port: 5432
    protocol: TCP
  - service: "bank-cache.bank-prod.svc.cluster.local"
    port: 6379
    protocol: TCP
  - service: "kube-dns.kube-system.svc.cluster.local"
    port: 53
    protocol: UDP

# Self-Healing controller workload identity (SPIFFE / IRSA / managed identity).
controller:
  serviceAccount: aegis-healing-controller
  image: registry.bank.internal/aegis/healing:0.1.0
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }
