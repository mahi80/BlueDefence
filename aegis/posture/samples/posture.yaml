# Sample VAPT-loop config: every scan BlueDefence knows, against the bundled samples.
# In a bank, point each input at the export the cloud / platform team drops (or set live: true).
store: /tmp/aegis-posture-store        # latest.json here is what the SOC console's Posture page reads
interval_minutes: 1440                 # --loop: one run a day
keep_runs: 90
waivers: iac/waivers.yaml              # one exception register for every scan
sla_days: {critical: 7, high: 30, medium: 90, low: 180}

scans:
  - name: aws-prod-iam
    type: iam
    auth_details: aws_iam_auth_details.json
    credential_report: aws_credential_report.csv
    trusted_accounts: []
  - name: aws-prod-ap-south-1
    type: cspm
    bundle: aws_cspm_bundle.json       # or: live: true, region: ap-south-1  (AEGIS_POSTURE_LIVE=1)
  - name: eks-payments
    type: k8s
    export: k8s_cluster_export.json    # or: live: true, context: eks-payments
  - name: infra-repo-main
    type: iac
    plan: iac/plan.json
    k8s: [iac/k8s]
