# The exposure engine inside the VAPT loop, on the sample bank (paths relative to this file).
store: /tmp/aegis-exposure-store
sla_days: {critical: 7, high: 30, medium: 90, low: 180}
waivers: waivers.yaml
scans:
  - name: exposure-sample-bank
    type: exposure
    vulns: [tenable_vulns.json]
    aws_bundles: [aws_bundle.json]
    inventory: inventory.csv
    kev: kev_sample.json
    epss: epss_sample.csv
    waf_coverage: [waf_coverage.json]
    settings: exposure.yaml
