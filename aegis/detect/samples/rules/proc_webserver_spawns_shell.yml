title: Web server worker spawns a shell
id: 7c1f2e10-0b1d-4c55-9a51-0d6f5e0c0001
status: experimental
description: An IIS / Tomcat / Java web worker starting a command shell (web shell). Sample rule for BlueDefence.
logsource: {category: process_creation, product: windows}
detection:
  selection_parent:
    ParentImage|endswith: ['\w3wp.exe', '\tomcat9.exe', '\java.exe']
  selection_child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\pwsh.exe']
  filter_health:
    CommandLine|contains: 'healthcheck.ps1'
  condition: all of selection_* and not filter_health
falsepositives: [Deployment scripts run by the app pool]
level: high
tags: [attack.persistence, attack.t1505.003]
