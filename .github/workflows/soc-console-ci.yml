name: soc-console

on:
  pull_request:
    paths:
      - "soc-console/**"
      - ".github/workflows/soc-console-ci.yml"
  push:
    branches: [main]
    paths:
      - "soc-console/**"
      - ".github/workflows/soc-console-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: soc-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
